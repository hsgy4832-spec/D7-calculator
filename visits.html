<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>آخر الزيارات - D7</title>

<style>
:root{
  --yellow:#FACC15;
  --bg:#101010;
  --panel:#181818;
  --border:#FACC1545;
  --muted:#999;
  --text:#f5f5f5;
}

*{
  box-sizing:border-box;
}

body{
  font-family:Arial,system-ui,sans-serif;
  margin:0;
  min-height:100vh;
  padding:18px;
  background:
    radial-gradient(circle at 50% 0%,#facc1512 0,transparent 34%),
    var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.card{
  width:100%;
  max-width:560px;
  margin-top:30px;
  background:linear-gradient(180deg,#1b1b1b,#141414);
  padding:24px;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 18px 55px #0008;
}

.logo{
  font-size:44px;
  line-height:1;
  font-weight:900;
  letter-spacing:4px;
  text-align:center;
  color:var(--yellow);
  margin-bottom:8px;
}

h1{
  text-align:center;
  margin:0;
  font-size:24px;
}

.sub{
  text-align:center;
  color:var(--muted);
  margin:8px 0 22px;
  font-size:14px;
}

.stats{
  display:flex;
  gap:12px;
  margin-bottom:18px;
}

.stat{
  flex:1;
  text-align:center;
  padding:16px 10px;
  background:var(--panel);
  border:1px solid #ffffff12;
  border-radius:13px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:13px;
  margin-bottom:7px;
}

.stat b{
  font-size:28px;
  color:var(--yellow);
}

.visit{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  margin:9px 0;
  background:var(--panel);
  border:1px solid #ffffff12;
  border-radius:12px;
}

.number{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:#101010;
  color:var(--yellow);
  font-weight:900;
}

.time{
  flex:1;
}

.time b{
  display:block;
  font-size:15px;
}

.time small{
  display:block;
  color:var(--muted);
  margin-top:4px;
}

.loading,
.empty,
.error{
  text-align:center;
  padding:20px;
  color:var(--muted);
}

.error{
  color:#ff7777;
}

.back{
  display:block;
  width:100%;
  padding:13px;
  margin-top:18px;
  border-radius:10px;
  background:var(--yellow);
  color:#101010;
  text-align:center;
  text-decoration:none;
  font-weight:900;
}

@media(max-width:520px){
  body{
    padding:12px;
  }

  .card{
    margin-top:15px;
    padding:18px;
  }
}
</style>
</head>

<body>

<div class="card">

<div class="logo">D7</div>

<h1>آخر الزيارات</h1>

<p class="sub">
سجل زيارات الموقع
</p>

<div class="stats">

<div class="stat">
<span>إجمالي الزيارات</span>
<b id="totalVisits">0</b>
</div>

<div class="stat">
<span>آخر زيارة</span>
<b id="lastVisit">—</b>
</div>

</div>

<div id="visitsList">
<div class="loading">جاري تحميل الزيارات...</div>
</div>

<a class="back" href="./index.html">
العودة إلى الحاسبة
</a>

</div>

<script>

const SUPABASE_URL =
"https://wcctqerfhpqzuizieyrb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_XmCwSwG98FoaPrwtjp9TDQ_WyAc3uCb";


async function loadVisits(){

  const list =
    document.getElementById("visitsList");

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/visits?select=id,visited_at&order=visited_at.desc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error(
        await response.text()
      );
    }

    const visits =
      await response.json();

    document
      .getElementById("totalVisits")
      .textContent = visits.length;

    if(visits.length === 0){

      document
        .getElementById("lastVisit")
        .textContent = "—";

      list.innerHTML =
        '<div class="empty">لا توجد زيارات حتى الآن</div>';

      return;
    }

    document
      .getElementById("lastVisit")
      .textContent =
        formatTime(visits[0].visited_at);

    list.innerHTML = "";

    visits.forEach(
      (visit,index) => {

        const date =
          new Date(visit.visited_at);

        const item =
          document.createElement("div");

        item.className = "visit";

        item.innerHTML = `
          <div class="number">
            ${index + 1}
          </div>

          <div class="time">
            <b>${formatTime(visit.visited_at)}</b>
            <small>
              ${formatDate(date)}
            </small>
          </div>
        `;

        list.appendChild(item);

      }
    );

  }catch(error){

    console.error(error);

    list.innerHTML =
      '<div class="error">حدث خطأ في تحميل الزيارات</div>';

  }

}


function formatTime(value){

  const date =
    new Date(value);

  return date.toLocaleTimeString(
    "ar-JO",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function formatDate(date){

  return date.toLocaleDateString(
    "ar-JO",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric"
    }
  );

}


loadVisits();

</script>

</body>
</html>
