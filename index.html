<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حاسبة النقاط - D7</title>

<style>
:root{
  --yellow:#FACC15;
  --bg:#101010;
  --panel:#181818;
  --border:#FACC1545;
  --muted:#999;
  --text:#f5f5f5;
}

*{box-sizing:border-box;}

body{
  font-family:Arial,system-ui,sans-serif;
  margin:0;
  min-height:100vh;
  padding:18px;
  background:
    radial-gradient(circle at 50% 0%,#facc1512 0,transparent 34%),
    var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:100%;
  max-width:560px;
  background:linear-gradient(180deg,#1b1b1b,#141414);
  padding:24px;
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 18px 55px #0008;
}

.top{position:relative;}

.menu{
  position:absolute;
  left:0;
  top:0;
  z-index:20;
}

.menu button{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#181818;
  color:var(--yellow);
  font-size:24px;
  cursor:pointer;
}

.menu-content{
  display:none;
  position:absolute;
  left:0;
  top:48px;
  width:180px;
  background:#181818;
  border:1px solid var(--border);
  border-radius:12px;
  padding:7px;
  z-index:30;
  box-shadow:0 12px 30px #0008;
}

.menu-content a{
  display:block;
  padding:12px;
  border-radius:8px;
  color:white;
  text-decoration:none;
  font-weight:700;
}

.menu-content a:hover{
  background:#222;
  color:var(--yellow);
}

.logo{
  font-size:44px;
  line-height:1;
  font-weight:900;
  letter-spacing:4px;
  text-align:center;
  color:var(--yellow);
  margin-bottom:8px;
}

h1{
  text-align:center;
  margin:0;
  font-size:24px;
}

.sub{
  text-align:center;
  color:var(--muted);
  margin:8px 0 22px;
  font-size:14px;
}

.row{
  display:flex;
  align-items:center;
  gap:14px;
  margin:12px 0;
  padding:13px;
  background:var(--panel);
  border:1px solid #ffffff12;
  border-radius:13px;
}

label{
  flex:1;
  font-weight:700;
}

small{
  display:block;
  color:var(--muted);
  margin-top:5px;
  font-weight:400;
  font-size:12px;
}

input{
  width:118px;
  padding:12px 10px;
  border-radius:10px;
  border:1px solid #facc1540;
  outline:none;
  background:#101010;
  color:#fff;
  font-size:18px;
  text-align:center;
  font-weight:700;
}

input:focus{
  border-color:var(--yellow);
  box-shadow:0 0 0 3px #facc1512;
}

.total{
  text-align:center;
  background:linear-gradient(180deg,#1c1c1c,#151515);
  border:1px solid #facc1555;
  border-radius:16px;
  padding:20px;
  margin-top:20px;
}

.total span{
  display:block;
  color:var(--yellow);
  font-weight:800;
}

.total b{
  display:block;
  color:#fff;
  font-size:52px;
  margin-top:9px;
}

.details{
  margin-top:13px;
  padding:12px 14px;
  border-radius:11px;
  background:#151515;
  border:1px solid #ffffff0d;
  line-height:1.9;
  color:#aaa;
  font-size:13px;
}

.reset{
  width:100%;
  padding:13px;
  margin-top:14px;
  border:0;
  border-radius:10px;
  background:var(--yellow);
  color:#101010;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

.reset:hover{
  filter:brightness(1.08);
}

@media(max-width:520px){
  body{
    padding:12px;
    align-items:flex-start;
    padding-top:20px;
  }

  .card{padding:18px;}

  input{width:100px;}
}
</style>
</head>

<body>

<div class="card">

<div class="top">

<div class="menu">

<button onclick="toggleMenu()" aria-label="القائمة">⋮</button>

<div class="menu-content" id="menuContent">

<a href="./management.html">
📊 نقاط الإدارة
</a>

</div>

</div>

<div class="logo">D7</div>

<h1>حاسبة النقاط</h1>

<p class="sub">
حاسبة نقاط الإدارة الأسبوعية
</p>

</div>

<div class="row">
<label>
التكتات
<small>4 تكتات = 1 نقطة</small>
</label>
<input id="tickets" type="number" min="0">
</div>

<div class="row">
<label>
التحذيرات
<small>3 تحذيرات = 1 نقطة</small>
</label>
<input id="warnings" type="number" min="0">
</div>

<div class="row">
<label>
السجن
<small>4 سجن = 1 نقطة</small>
</label>
<input id="jail" type="number" min="0">
</div>

<div class="row">
<label>
XP
<small>1750 اكسبي = 1 نقطة</small>
</label>
<input id="xp" type="number" min="0">
</div>

<div class="row">
<label>
تكتات النصب
<small>2 تكتات = 1 نقطة</small>
</label>
<input id="scam" type="number" min="0">
</div>

<div class="row">
<label>
الفعاليات
<small>كل فعالية = 10 نقاط</small>
</label>
<input id="events" type="number" min="0">
</div>

<div class="total">
<span>مجموع النقاط</span>
<b id="total">0</b>
</div>

<div class="details" id="details"></div>

<button class="reset" onclick="resetAll()">
تصفير
</button>

</div>

<script>

const SUPABASE_URL = "https://wcctqerfhpqzuizieyrb.supabase.co";

const SUPABASE_KEY = "sb_publishable_XmCwSwG98FoaPrwtjp9TDQ_WyAc3uCb";


async function recordVisit(){

  try{

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/visits",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json",
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({})
      }
    );

    if(!response.ok){
      console.log(
        "Visit error:",
        await response.text()
      );
    }

  }catch(error){

    console.log("Visit error:",error);

  }

}

recordVisit();


function toggleMenu(){

  const menu =
    document.getElementById("menuContent");

  menu.style.display =
    menu.style.display === "block"
    ? "none"
    : "block";
}


document.addEventListener(
  "click",
  function(event){

    const menu =
      document.querySelector(".menu");

    const content =
      document.getElementById("menuContent");

    if(!menu.contains(event.target)){
      content.style.display = "none";
    }

  }
);


function calc(){

  const n = id =>
    Math.max(
      0,
      Number(
        document
          .getElementById(id)
          .value
      ) || 0
    );

  const t = n("tickets") / 4;
  const w = n("warnings") / 3;
  const j = n("jail") / 4;
  const x = n("xp") / 1750;
  const s = n("scam") / 2;
  const e = n("events") * 10;

  const total =
    t + w + j + x + s + e;

  document
    .getElementById("total")
    .textContent =
      Number(total.toFixed(1));

  document
    .getElementById("details")
    .innerHTML =
      "التكتات: " + Number(t.toFixed(1)) + " نقطة<br>" +
      "التحذيرات: " + Number(w.toFixed(1)) + " نقطة<br>" +
      "السجن: " + Number(j.toFixed(1)) + " نقطة<br>" +
      "XP: " + Number(x.toFixed(1)) + " نقطة<br>" +
      "تكتات النصب: " + Number(s.toFixed(1)) + " نقطة<br>" +
      "الفعاليات: " + Number(e.toFixed(1)) + " نقطة";
}


document
  .querySelectorAll("input")
  .forEach(input => {

    input.addEventListener(
      "input",
      calc
    );

  });


function resetAll(){

  document
    .querySelectorAll("input")
    .forEach(input => {
      input.value = "";
    });

  calc();
}


calc();

</script>

</body>
</html>
