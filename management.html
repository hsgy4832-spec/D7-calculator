<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل نقاط الإدارة - D7</title>

<style>
:root{
  --yellow:#FACC15;
  --bg:#050505;
  --panel:#111111;
  --border:#FACC1538;
  --muted:#8a8a8a;
  --text:#f5f5f5;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  padding:20px;
  font-family:Arial,system-ui,sans-serif;
  background:#050505;
  color:var(--text);
  display:flex;
  justify-content:center;
}

.card{
  width:100%;
  max-width:560px;
  background:#0d0d0d;
  border:1px solid var(--border);
  border-radius:20px;
  padding:24px;
  box-shadow:0 18px 55px #000;
}

.logo{
  text-align:center;
  color:var(--yellow);
  font-size:42px;
  font-weight:900;
  letter-spacing:4px;
}

h1{
  text-align:center;
  margin:8px 0;
}

.sub{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-bottom:22px;
}

.add{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

input{
  flex:1;
  padding:13px;
  border-radius:10px;
  border:1px solid #facc1530;
  background:#070707;
  color:white;
  outline:none;
  font-size:16px;
}

button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  background:var(--yellow);
  color:#050505;
  font-weight:900;
  cursor:pointer;
}

.member{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px;
  margin:10px 0;
  background:var(--panel);
  border:1px solid #ffffff0d;
  border-radius:13px;
}

.name{
  font-weight:800;
}

.points{
  color:var(--yellow);
  font-weight:900;
}

.actions{
  display:flex;
  gap:6px;
}

.actions button{
  padding:7px 10px;
  font-size:12px;
}

.delete{
  background:#ff4444;
  color:white;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}
</style>
</head>

<body>

<div class="card">

<div class="logo">D7</div>

<h1>سجل نقاط الإدارة</h1>

<p class="sub">النقاط محفوظة على هذا الجهاز</p>

<div class="add">
<input id="name" type="text" placeholder="اسم الإداري">
<input id="points" type="number" min="0" placeholder="النقاط">
<button onclick="addMember()">إضافة</button>
</div>

<div id="list"></div>

</div>

<script>

let members = JSON.parse(localStorage.getItem("d7_members")) || [];

function save(){
  localStorage.setItem("d7_members", JSON.stringify(members));
}

function render(){

  const list = document.getElementById("list");

  if(members.length === 0){
    list.innerHTML = '<div class="empty">لا يوجد إداريين حتى الآن</div>';
    return;
  }

  members.sort((a,b)=>b.points-a.points);

  list.innerHTML = members.map((m,i)=>`
    <div class="member">

      <div>
        <div class="name">${i+1}. ${m.name}</div>
        <div class="points">${m.points} نقطة</div>
      </div>

      <div class="actions">
        <button onclick="addPoints(${i})">+ نقاط</button>
        <button class="delete" onclick="removeMember(${i})">حذف</button>
      </div>

    </div>
  `).join("");
}

function addMember(){

  const name = document.getElementById("name").value.trim();
  const points = Number(document.getElementById("points").value) || 0;

  if(!name){
    alert("اكتب اسم الإداري");
    return;
  }

  members.push({
    name:name,
    points:points
  });

  save();
  render();

  document.getElementById("name").value="";
  document.getElementById("points").value="";
}

function addPoints(index){

  const amount = prompt("كم نقطة تريد إضافتها؟");

  if(amount === null) return;

  const value = Number(amount);

  if(!Number.isFinite(value) || value < 0){
    alert("أدخل رقم صحيح");
    return;
  }

  members[index].points += value;

  save();
  render();
}

function removeMember(index){

  if(confirm("هل تريد حذف هذا الإداري؟")){
    members.splice(index,1);
    save();
    render();
  }

}

render();

</script>

</body>
</html>
