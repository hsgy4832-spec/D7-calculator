<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D7 — نقاط الإدارة</title>

<style>
:root{
  --gold:#FACC15;
  --gold-soft:#FACC1530;
  --black:#050505;
  --surface:#0b0b0b;
  --line:#ffffff12;
  --muted:#777;
  --white:#f4f4f4;
  --red:#ef4444;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:25px 16px;
  background:var(--black);
  color:var(--white);
  font-family:Arial,system-ui,sans-serif;
}

.wrapper{
  width:100%;
  max-width:620px;
  margin:auto;
}

/* Header */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding-bottom:22px;
  border-bottom:1px solid var(--line);
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-mark{
  color:var(--gold);
  font-size:28px;
  font-weight:900;
  letter-spacing:3px;
}

.brand-text{
  color:#777;
  font-size:11px;
  letter-spacing:2px;
}

.back{
  color:#777;
  text-decoration:none;
  font-size:13px;
  transition:.2s;
}

.back:hover{
  color:var(--gold);
}

/* Hero */

.hero{
  padding:42px 0 30px;
}

.eyebrow{
  color:var(--gold);
  font-size:11px;
  letter-spacing:3px;
  margin-bottom:10px;
}

h1{
  margin:0;
  font-size:32px;
}

.subtitle{
  margin:10px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* Add */

.add-section{
  padding:22px 0;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.add-title{
  font-size:13px;
  font-weight:700;
  margin-bottom:14px;
}

.add{
  display:grid;
  grid-template-columns:minmax(0,1fr) 110px 75px;
  gap:8px;
}

input{
  width:100%;
  min-width:0;
  padding:12px;
  border:1px solid #ffffff14;
  border-radius:8px;
  background:#080808;
  color:white;
  outline:none;
  text-align:center;
  font-size:14px;
}

input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px #facc1508;
}

.add button{
  border:0;
  border-radius:8px;
  background:var(--gold);
  color:#050505;
  font-weight:900;
  cursor:pointer;
}

.add button:hover{
  filter:brightness(1.08);
}

/* List */

.list-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:28px 0 8px;
}

.list-title span:first-child{
  font-size:13px;
  font-weight:700;
}

.list-title span:last-child{
  color:#555;
  font-size:11px;
}

.member{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  min-height:78px;
  border-bottom:1px solid var(--line);
}

.member-info{
  min-width:0;
}

.rank{
  color:#555;
  font-size:11px;
  margin-bottom:5px;
}

.name{
  font-size:16px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.points{
  margin-top:5px;
  color:var(--gold);
  font-size:12px;
  font-weight:800;
}

.actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.actions button{
  border:1px solid #ffffff14;
  border-radius:7px;
  padding:8px 10px;
  background:#0a0a0a;
  color:var(--gold);
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}

.actions button:hover{
  border-color:var(--gold);
}

.actions .delete{
  color:#ef4444;
}

.actions .delete:hover{
  border-color:#ef4444;
}

.empty{
  padding:35px 0;
  text-align:center;
  color:#555;
  font-size:13px;
}

/* Footer */

.footer{
  margin-top:30px;
  padding-top:18px;
  border-top:1px solid var(--line);
  text-align:center;
  color:#444;
  font-size:10px;
  letter-spacing:2px;
}

/* Mobile */

@media(max-width:500px){

  body{
    padding:18px 14px;
  }

  .hero{
    padding:34px 0 26px;
  }

  h1{
    font-size:27px;
  }

  .add{
    grid-template-columns:1fr 85px 65px;
  }

  .add button{
    font-size:12px;
  }

  .member{
    min-height:74px;
  }

  .actions button{
    padding:8px;
    font-size:11px;
  }

}
</style>
</head>

<body>

<div class="wrapper">

  <header class="header">

    <div class="brand">
      <div class="brand-mark">D7</div>
      <div class="brand-text">ADMINISTRATION</div>
    </div>

    <a
      href="./index.html"
      class="back"
    >
      ← الحاسبة
    </a>

  </header>


  <section class="hero">

    <div class="eyebrow">
      MANAGEMENT
    </div>

    <h1>نقاط الإدارة</h1>

    <p class="subtitle">
      إدارة وترتيب نقاط الإداريين
    </p>

  </section>


  <section class="add-section">

    <div class="add-title">
      إضافة إداري
    </div>

    <div class="add">

      <input
        id="name"
        type="text"
        placeholder="اسم الإداري"
      >

      <input
        id="points"
        type="number"
        min="0"
        placeholder="النقاط"
      >

      <button onclick="addMember()">
        إضافة
      </button>

    </div>

  </section>


  <div class="list-title">

    <span>ترتيب الإداريين</span>

    <span id="count">
      0 إداري
    </span>

  </div>


  <div id="list"></div>


  <div class="footer">
    D7 ADMIN SYSTEM
  </div>

</div>


<script>

let members =
  JSON.parse(
    localStorage.getItem("d7_members")
  ) || [];


function save(){

  localStorage.setItem(
    "d7_members",
    JSON.stringify(members)
  );

}


function render(){

  const list =
    document.getElementById("list");

  const count =
    document.getElementById("count");


  count.textContent =
    members.length + " إداري";


  if(members.length === 0){

    list.innerHTML =
      '<div class="empty">لا يوجد إداريين حتى الآن</div>';

    return;
  }


  members.sort(
    (a,b) => b.points - a.points
  );


  list.innerHTML =
    members.map((m,i) => `

      <div class="member">

        <div class="member-info">

          <div class="rank">
            #${i + 1}
          </div>

          <div class="name">
            ${escapeHTML(m.name)}
          </div>

          <div class="points">
            ${m.points} نقطة
          </div>

        </div>


        <div class="actions">

          <button
            onclick="addPoints(${i})"
          >
            + نقاط
          </button>

          <button
            class="delete"
            onclick="removeMember(${i})"
          >
            حذف
          </button>

        </div>

      </div>

    `).join("");

}


function addMember(){

  const name =
    document
      .getElementById("name")
      .value
      .trim();


  const points =
    Number(
      document
        .getElementById("points")
        .value
    ) || 0;


  if(!name){

    alert("اكتب اسم الإداري");

    return;
  }


  members.push({
    name:name,
    points:points
  });


  save();
  render();


  document.getElementById("name").value = "";
  document.getElementById("points").value = "";

}


function addPoints(index){

  const amount =
    prompt(
      "كم نقطة تريد إضافتها؟"
    );


  if(amount === null){
    return;
  }


  const value =
    Number(amount);


  if(
    !Number.isFinite(value) ||
    value < 0
  ){

    alert("أدخل رقم صحيح");

    return;
  }


  members[index].points += value;


  save();
  render();

}


function removeMember(index){

  if(
    confirm(
      "هل تريد حذف هذا الإداري؟"
    )
  ){

    members.splice(index,1);

    save();
    render();

  }

}


function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}


render();

</script>

</body>
</html>
