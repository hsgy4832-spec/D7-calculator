<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل نقاط الإدارة - D7</title>

<style>
:root{
  --yellow:#FACC15;
  --bg:#101010;
  --panel:#181818;
  --border:#FACC1545;
  --muted:#999;
  --text:#f5f5f5;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  padding:16px;
  font-family:Arial,system-ui,sans-serif;
  background:
    radial-gradient(circle at 50% 0%,#facc1512,transparent 35%),
    var(--bg);
  color:var(--text);
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.card{
  width:100%;
  max-width:560px;
  background:linear-gradient(180deg,#1b1b1b,#141414);
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  box-shadow:0 18px 55px #0008;
}

.logo{
  text-align:center;
  color:var(--yellow);
  font-size:42px;
  font-weight:900;
  letter-spacing:4px;
}

h1{
  text-align:center;
  margin:8px 0;
  font-size:23px;
}

.sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:22px;
}

/* خانة الإضافة */

.add{
  display:grid;
  grid-template-columns:1fr 110px 75px;
  gap:8px;
  width:100%;
  margin-bottom:20px;
}

input{
  width:100%;
  min-width:0;
  padding:12px 8px;
  border-radius:10px;
  border:1px solid #facc1540;
  background:#101010;
  color:white;
  outline:none;
  font-size:15px;
  text-align:center;
}

input:focus{
  border-color:var(--yellow);
  box-shadow:0 0 0 3px #facc1512;
}

.add button{
  width:100%;
  padding:12px 5px;
  border:0;
  border-radius:10px;
  background:var(--yellow);
  color:#101010;
  font-weight:900;
  cursor:pointer;
}

/* الإداري */

.member{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:14px;
  margin:10px 0;
  background:var(--panel);
  border:1px solid #ffffff12;
  border-radius:13px;
}

.name{
  font-weight:800;
  font-size:16px;
}

.points{
  color:var(--yellow);
  font-weight:900;
  margin-top:4px;
}

.actions{
  display:flex;
  gap:6px;
  flex-shrink:0;
}

.actions button{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  background:var(--yellow);
  color:#101010;
  font-weight:900;
  cursor:pointer;
}

.actions .delete{
  background:#d93636;
  color:white;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:25px;
}

/* العودة للحاسبة */

.back{
  display:block;
  width:100%;
  margin-top:18px;
  padding:12px;
  text-align:center;
  text-decoration:none;
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--yellow);
  background:#181818;
  font-weight:900;
}

.back:hover{
  background:#222;
}

@media(max-width:430px){

  .card{
    padding:16px;
  }

  .add{
    grid-template-columns:1fr 90px 65px;
    gap:6px;
  }

  input{
    font-size:14px;
  }

  .add button{
    font-size:13px;
  }

  .member{
    padding:12px;
  }

  .actions button{
    padding:7px 8px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<div class="card">

<div class="logo">D7</div>

<h1>سجل نقاط الإدارة</h1>

<p class="sub">إدارة نقاط الإداريين</p>

<div class="add">

<input
  id="name"
  type="text"
  placeholder="اسم الإداري"
>

<input
  id="points"
  type="number"
  min="0"
  placeholder="النقاط"
>

<button onclick="addMember()">إضافة</button>

</div>

<div id="list"></div>

<a href="index.html" class="back">
← العودة للحاسبة
</a>

</div>

<script>

let members =
JSON.parse(localStorage.getItem("d7_members")) || [];

function save(){

  localStorage.setItem(
    "d7_members",
    JSON.stringify(members)
  );

}

function render(){

  const list =
    document.getElementById("list");

  if(members.length === 0){

    list.innerHTML =
      '<div class="empty">لا يوجد إداريين حتى الآن</div>';

    return;
  }

  members.sort(
    (a,b)=>b.points-a.points
  );

  list.innerHTML =
    members.map((m,i)=>`

      <div class="member">

        <div>

          <div class="name">
            ${i+1}. ${m.name}
          </div>

          <div class="points">
            ${m.points} نقطة
          </div>

        </div>

        <div class="actions">

          <button onclick="addPoints(${i})">
            + نقاط
          </button>

          <button
            class="delete"
            onclick="removeMember(${i})"
          >
            حذف
          </button>

        </div>

      </div>

    `).join("");

}

function addMember(){

  const name =
    document.getElementById("name")
    .value.trim();

  const points =
    Number(
      document.getElementById("points").value
    ) || 0;

  if(!name){

    alert("اكتب اسم الإداري");

    return;
  }

  members.push({
    name:name,
    points:points
  });

  save();
  render();

  document.getElementById("name").value="";
  document.getElementById("points").value="";
}

function addPoints(index){

  const amount =
    prompt("كم نقطة تريد إضافتها؟");

  if(amount === null) return;

  const value = Number(amount);

  if(!Number.isFinite(value) || value < 0){

    alert("أدخل رقم صحيح");

    return;
  }

  members[index].points += value;

  save();
  render();
}

function removeMember(index){

  if(confirm("هل تريد حذف هذا الإداري؟")){

    members.splice(index,1);

    save();
    render();
  }

}

render();

</script>

</body>
</html>
